name: Check utilities and release package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Explicit x64 images keep the tested OS and architecture visible.
        # macos-latest ARM64 jobs previously expired without acquiring a runner.
        os: [ubuntu-24.04, macos-26-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Record Python and platform
        run: python -c "import platform, sys; print(sys.version); print(platform.platform()); print(platform.machine())"
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_release.py --output dist
      - run: python scripts/verify_handoff.py --archive dist/personal-agent-growth-0.4.0.zip --manifest dist/manifest.json
      - run: python -B scripts/check_publication.py
