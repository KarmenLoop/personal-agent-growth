name: Check utilities and release package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_release.py --output dist
      - run: python scripts/verify_handoff.py --archive dist/personal-agent-growth-0.3.2.zip --manifest dist/manifest.json
