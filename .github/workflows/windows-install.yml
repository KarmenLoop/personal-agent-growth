name: Check Windows installation and shared files

on:
  push:
    paths:
      - ".github/workflows/windows-install.yml"
      - "tools/check_windows_install.py"
      - "docs/install.md"
      - "docs/install.zh-CN.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: windows-2025
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python tools/build_release.py --output dist
      - name: Run guide commands and shared-memory file checks
        shell: pwsh
        run: python -X utf8 tools/check_windows_install.py --shell ${{ matrix.shell }} --local-artifacts dist --output "${{ runner.temp }}/windows-install-evidence"
      - name: Keep commands, outputs, state revisions, and receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-install-${{ matrix.shell }}
          path: ${{ runner.temp }}/windows-install-evidence
          if-no-files-found: error
          retention-days: 90
      - run: python -B scripts/check_publication.py
